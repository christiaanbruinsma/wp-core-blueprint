name: Designer viewport ownership materializer

on:
  push:
    branches:
      - design-foundation-designer-shell-fullscreen

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: design-foundation-designer-shell-fullscreen
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Synchronize viewport ownership
        run: python3 tools/designer-viewport-owner-sync.py

      - name: Normalize temporary sync idempotence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/Mail/Admin/Page.php')
          source = page.read_text()
          import_line = "use CB\\Core\\Brand\\CoreBlueprintMark;\n"
          while source.count(import_line) > 1:
              source = source.replace(import_line + import_line, import_line, 1)
          page.write_text(source)

          test = Path('tests/integration/DesignerModeHeaderTest.php')
          source = test.read_text()
          signature = "\tpublic function test_designer_mode_and_hud_share_the_canonical_core_blueprint_mark(): void {"
          first = source.find(signature)
          second = source.find(signature, first + len(signature)) if first >= 0 else -1
          while second >= 0:
              end = source.find("\n\t}\n", second)
              if end < 0:
                  raise RuntimeError('Could not normalize duplicate Designer Mode brand test')
              source = source[:second] + source[end + len("\n\t}\n"):]
              first = source.find(signature)
              second = source.find(signature, first + len(signature)) if first >= 0 else -1
          test.write_text(source)
          PY

      - name: Validate Designer Mode JavaScript contract
        run: node --test tests/js/design-mail-profile.test.mjs

      - name: Validate PHP and translations
        run: bash tests/bin/php-lint.sh

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/design/editor-shell.css assets/js/features/mail-designer.js assets/js/features/designer-launch.js templates/mail-designer.php src/Brand/CoreBlueprintMark.php src/HUD/Brand/CoreBlueprint.php src/Mail/Admin/Page.php tests/integration/DesignerModeHeaderTest.php tests/js/design-mail-profile.test.mjs
          if git diff --cached --quiet; then
            echo "Designer viewport ownership and canonical brand are already synchronized."
            exit 0
          fi
          git commit -m "Designer Mode: centralize viewport state and brand mark"
          git push origin HEAD:design-foundation-designer-shell-fullscreen
