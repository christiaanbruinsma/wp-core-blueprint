name: BASE-10E.2 final validation

on:
  push:
    branches:
      - base-10e2-rc3.27

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: base-10e2-rc3.27

      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate E2 manifests and module catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          registry = (root / 'src/Admin/ScreenAssetRegistry.php').read_text()
          definitions = '\n'.join(p.read_text() for p in sorted((root / 'src/Admin').glob('AdminModuleDefinitions*.php')))

          selected = set(re.findall(r"'((?:page|component|foundation|module|provider)\.[a-z0-9.-]+)'", registry))
          modules = re.findall(r"'(@cb-core/[a-z0-9-]+)'\s*=>\s*static function", definitions)
          module_set = set(modules)

          if len(modules) != len(module_set):
              raise SystemExit('Duplicate module definitions detected')
          if len(module_set) != 35:
              raise SystemExit(f'Expected 35 module definitions, found {len(module_set)}')

          missing_modules = sorted(
              '@cb-core/' + asset[7:]
              for asset in selected
              if asset.startswith('module.') and '@cb-core/' + asset[7:] not in module_set
          )
          if missing_modules:
              raise SystemExit('Missing module definitions: ' + ', '.join(missing_modules))

          for asset in sorted(selected):
              if asset.startswith('page.'):
                  path = root / 'assets/css/pages' / (asset[5:] + '.css')
                  if asset == 'page.preferences-floating-menu':
                      path = root / 'assets/css/pages/preferences-floating-menu.css'
                  if not path.is_file():
                      raise SystemExit(f'Missing page style for {asset}: {path}')
              elif asset.startswith('component.'):
                  name = asset[10:]
                  if name in {'meta', 'mode-switcher', 'filter-bar'}:
                      path = root / 'assets/css/components' / (name + '.css')
                  else:
                      path = root / 'assets/css/components' / (name + '.css')
                  if not path.is_file():
                      raise SystemExit(f'Missing component style for {asset}: {path}')

          required_hidden = {
              '@cb-core/login-shield': '@cb-core/modal',
              '@cb-core/reports': '@cb-core/modal',
              '@cb-core/reports-preferences': '@cb-core/modal',
              '@cb-core/site-mode': '@cb-core/toast',
          }
          for module, dependency in required_hidden.items():
              pattern = re.compile(re.escape("'" + module + "'") + r".*?'deps'\s*=>\s*\[([^\]]*)\]", re.S)
              match = pattern.search(definitions)
              if not match or ("'" + dependency + "'") not in match.group(1):
                  raise SystemExit(f'Explicit dependency missing: {module} -> {dependency}')

          print(f'E2 manifest PASS: {len(selected)} selected IDs, {len(module_set)} modules')
          PY

      - name: Validate release identity
        run: |
          grep -q 'Version:     1.0.0-rc3.27' core-blueprint.php
          grep -q "define( 'CB_CORE_VERSION',     '1.0.0-rc3.27' );" core-blueprint.php
          test ! -e .github/workflows/base-10e2-snapshot.yml

      - name: Build canonical plugin ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/release/core-blueprint"
          rsync -a --exclude='.git' --exclude='.github' ./ "$RUNNER_TEMP/release/core-blueprint/"
          cd "$RUNNER_TEMP/release"
          zip -qr "$GITHUB_WORKSPACE/core-blueprint-1.0.0-rc3.27.zip" core-blueprint
          test "$(unzip -Z1 "$GITHUB_WORKSPACE/core-blueprint-1.0.0-rc3.27.zip" | sed 's#/.*##' | sort -u)" = 'core-blueprint'
          unzip -p "$GITHUB_WORKSPACE/core-blueprint-1.0.0-rc3.27.zip" core-blueprint/core-blueprint.php | grep -q 'Version:     1.0.0-rc3.27'

      - uses: actions/upload-artifact@v4
        with:
          name: core-blueprint-1.0.0-rc3.27
          path: core-blueprint-1.0.0-rc3.27.zip
          retention-days: 7
