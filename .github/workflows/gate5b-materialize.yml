name: Gate 5B materialize

on:
  push:
    branches:
      - base-v1-gate5b-localization-quality
    paths:
      - '.github/workflows/gate5b-materialize.yml'

permissions:
  contents: write

concurrency:
  group: gate5b-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v7.0.1
        with:
          ref: base-v1-gate5b-localization-quality
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Assemble reviewed repair manifest
        run: cat tools/gate5b-repairs.part-* > tools/gate5b-repairs.xz.b64

      - name: Materialize WordPress-native catalogs
        run: python3 tools/gate5b-materialize.py

      - name: Remove temporary manifest chunks
        run: rm -f tools/gate5b-repairs.part-*

      - name: Validate translation freshness and contracts
        run: php tools/check-translations.php

      - name: Validate PHP syntax
        run: bash tests/bin/php-lint.sh

      - name: Commit materialized Gate 5B catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No materialized changes found.'; exit 1; }
          git commit -m 'Gate 5B: materialize reviewed WordPress-native catalogs'
          git push origin HEAD:base-v1-gate5b-localization-quality
