name: Designer Mode localization materializer

on:
  push:
    branches:
      - design-foundation-designer-shell-fullscreen

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: design-foundation-designer-shell-fullscreen
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Synchronize Designer Mode catalogs
        run: |
          php -l tools/l10n-designer-mode-sync.php
          php tools/l10n-designer-mode-sync.php

      - name: Validate translation guard and PHP syntax
        run: bash tests/bin/php-lint.sh

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit synchronized catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/core-blueprint-*.l10n.php tools/check-translations.php
          if git diff --cached --quiet; then
            echo "Designer Mode catalogs are already synchronized."
            exit 0
          fi
          git commit -m "L10N: synchronize Designer Mode catalogs"
          git push origin HEAD:design-foundation-designer-shell-fullscreen
