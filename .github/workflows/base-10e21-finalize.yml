name: BASE-10E.2.1 finalize

on:
  push:
    branches:
      - base-10e21-rc3.28

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: base-10e21-rc3.28

      - name: Apply rc3.28 Design Foundation contract repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('core-blueprint.php')
          s=p.read_text()
          s=s.replace('Version:     1.0.0-rc3.27','Version:     1.0.0-rc3.28',1)
          s=s.replace("define( 'CB_CORE_VERSION',     '1.0.0-rc3.27' );","define( 'CB_CORE_VERSION',     '1.0.0-rc3.28' );",1)
          p.write_text(s)

          p=Path('src/Admin/PageRegistry.php')
          s=p.read_text().replace('use CB\\Core\\UI;\n','')
          old="""\tprivate const COMPONENT_REQUIREMENTS = [
          \t\t'description-toggle',
          \t\t'form-controls',
          \t\t'panels',
          \t];"""
          new="""\tprivate const COMPONENT_REQUIREMENTS = [
          \t\t'badges',
          \t\t'cards',
          \t\t'description-toggle',
          \t\t'empty-state',
          \t\t'form-controls',
          \t\t'kv-table',
          \t\t'nav-tabs',
          \t\t'panels',
          \t\t'state-badges',
          \t\t'status',
          \t];"""
          if old not in s: raise SystemExit('PageRegistry component list not found')
          s=s.replace(old,new,1)
          old="""\t\tforeach ( self::$requirements[ $slug ]['foundations'] as $foundation ) {
          \t\t\tself::enqueue_foundation( $foundation );
          \t\t}
          \t\tforeach ( self::$requirements[ $slug ]['components'] as $component ) {
          \t\t\tself::enqueue_component( $component );
          \t\t}"""
          new="""\t\t$context = ScreenContext::from_request( $hook );
          \t\tforeach ( self::$requirements[ $slug ]['foundations'] as $foundation ) {
          \t\t\tself::enqueue_foundation( $foundation );
          \t\t}
          \t\tforeach ( self::$requirements[ $slug ]['components'] as $component ) {
          \t\t\tself::enqueue_component( $component, $context );
          \t\t}"""
          if old not in s: raise SystemExit('PageRegistry requirement loop not found')
          s=s.replace(old,new,1)
          start=s.index('\tprivate static function enqueue_component( string $component ): void {')
          end=s.index('\n\tprivate static function diagnostic', start)
          s=s[:start]+"""\tprivate static function enqueue_component( string $component, ScreenContext $context ): void {
          \t\tAdminAssetCatalog::enqueue_component_requirement( $component, $context );
          }
          """+s[end:]
          p.write_text(s)

          p=Path('src/Admin/AdminAssetCatalog.php')
          s=p.read_text()
          needle="""\t/** Whether an asset ID resolves to a known private definition. */
          \tpublic static function has( string $asset_id ): bool {
          \t\treturn null !== self::definition( $asset_id );
          \t}
          """
          insert="""\t/**
          \t * Resolve one public Core Admin Design Foundation component requirement.
          \t *
          \t * Semantic component IDs are public through PageRegistry; the private asset
          \t * IDs, WordPress handles, filenames and bundle boundaries mapped here are not.
          \t *
          \t * @internal PageRegistry is the public caller.
          \t */
          \tpublic static function enqueue_component_requirement( string $component, ScreenContext $context ): void {
          \t\t$map = [
          \t\t\t'badges'             => [ 'component.badges' ],
          \t\t\t'cards'              => [ 'component.cards' ],
          \t\t\t'description-toggle' => [ 'component.disclosure', 'module.description-toggle' ],
          \t\t\t'empty-state'        => [ 'component.empty-state' ],
          \t\t\t'form-controls'      => [ 'shell.form-controls' ],
          \t\t\t'kv-table'           => [ 'component.kv-tables' ],
          \t\t\t'nav-tabs'           => [ 'component.nav-tabs' ],
          \t\t\t'panels'             => [ 'component.panels' ],
          \t\t\t'state-badges'       => [ 'component.state-badges' ],
          \t\t\t'status'             => [ 'component.status-indicators' ],
          \t\t];

          \t\tforeach ( $map[ $component ] ?? [] as $asset_id ) {
          \t\t\tself::enqueue( $asset_id, $context );
          \t\t}
          \t}

          """+needle
          if needle not in s: raise SystemExit('AdminAssetCatalog insertion point not found')
          s=s.replace(needle,insert,1)
          p.write_text(s)

          p=Path('docs/PUBLIC-API.md')
          s=p.read_text()
          s=s.replace("'components'  => [ 'panels', 'form-controls' ],","'components'  => [ 'nav-tabs', 'panels', 'form-controls' ],",1)
          old="Additional shared UI is declared through semantic requirement identifiers. `foundations` currently supports `toast`, `modal`, `token-input`, `clipboard`, `time-picker`, `choice-group`, `icon-picker`, `capability-picker`, `object-picker`, `select-picker` and `icons`. `components` currently supports `description-toggle`, `panels` and `form-controls`. Unknown requirement identifiers or groups reject the page registration safely; identifiers are never interpreted as arbitrary asset handles. Additive requirement identifiers may be introduced during Base 1.x."
          new="Additional shared UI is declared through semantic requirement identifiers. `foundations` currently supports `toast`, `modal`, `token-input`, `clipboard`, `time-picker`, `choice-group`, `icon-picker`, `capability-picker`, `object-picker`, `select-picker` and `icons`. `components` currently supports `nav-tabs`, `panels`, `cards`, `badges`, `state-badges`, `status`, `empty-state`, `kv-table`, `form-controls` and `description-toggle`. Every component ID represents a documented Core Admin Design Foundation markup/behavior contract, not a stylesheet name; see `CORE-ADMIN-DESIGN-FOUNDATION.md`. Unknown requirement identifiers or groups reject the page registration safely, and raw asset handles are never interpreted as requirements. Additive requirement identifiers may be introduced during Base 1.x."
          if old not in s: raise SystemExit('PUBLIC-API component paragraph not found')
          s=s.replace(old,new,1)
          needle="`PageRegistry::hook_suffix( $slug )` is the supported way for an extension to scope its own CSS/JavaScript to its registered page after WordPress menu registration. Extensions remain free to enqueue their own assets. The current internal hook-suffix pattern fallback for unregistered sibling pages is transitional implementation behavior and **not** a public v1 guarantee; pages that want the Core Admin shell must register through `PageRegistry`."
          s=s.replace(needle,needle+"\n\nBase owns the canonical appearance of every declared Design Foundation primitive. First-party extension CSS may position or compose those primitives but must not locally redefine their generic colours, typography, spacing, borders, radii, surfaces, shadows or interaction states. Feature-specific extension components remain extension-owned and should consume `--cb-*` tokens where practical.",1)
          p.write_text(s)

          p=Path('docs/foundation-v1-contract.md')
          s=p.read_text()
          needle="Page CSS may own composition (grid, section rhythm, task-specific preview sizing) but must not visually clone one of these components."
          insert=needle+"""

          ### Public Core Admin Design Foundation semantics

          Registered Core Admin extension pages consume shared visual primitives through `PageRegistry` component IDs, not asset handles. The public v1 semantic set is `nav-tabs`, `panels`, `cards`, `badges`, `state-badges`, `status`, `empty-state`, `kv-table`, `form-controls` and `description-toggle`. Their minimal markup/behavior contracts are normative in `CORE-ADMIN-DESIGN-FOUNDATION.md`; Base remains free to change internal CSS filenames, handles, bundle boundaries and implementation details.

          Base owns canonical appearance for these primitives. First-party extension styles may position or compose them, but may not duplicate their generic surfaces, colour, typography, borders, radii, spacing, shadows, focus, hover or state styling. A deliberately different product-specific component or variant remains extension-owned and should use Base tokens where practical.

          Design ownership does not imply universal loading. The minimal Core Admin shell remains narrow; a page receives an optional primitive only when it declares that semantic requirement (or when a Base-owned screen manifest selects it)."""
          if needle not in s: raise SystemExit('Foundation ownership insertion point not found')
          s=s.replace(needle,insert,1)
          p.write_text(s)

          p=Path('CHANGELOG.md')
          s=p.read_text()
          entry="""## 1.0.0-rc3.28 — 2026-08-31

          ### BASE-10E.2.1 — Core Admin Design Foundation contract repair

          - Keep rc3.27 screen-scoped asset architecture and minimal Core Admin shell unchanged.
          - Expand PageRegistry with a small semantic Design Foundation component set: nav-tabs, panels, cards, badges, state-badges, status, empty-state, kv-table, form-controls and description-toggle.
          - Route public component semantics through the private AdminAssetCatalog so extensions never depend on Base CSS handles, filenames or bundle boundaries.
          - Add normative markup/behavior contracts and make Base the canonical visual owner of shared Core Admin primitives; first-party extensions may compose but not locally redraw those primitives.
          - Deliberately do not promote table-cols, policy-table, log-table or other page/feature styles to public Foundation contracts.

          """
          if not s.startswith('## 1.0.0-rc3.28'):
              s=entry+s
          p.write_text(s)
          PY

      - name: Validate PHP and JavaScript syntax
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "PHP files: $(find . -type f -name '*.php' -not -path './.git/*' | wc -l)"
          echo "JS files: $(find assets/js -type f -name '*.js' | wc -l)"

      - name: Validate PageRegistry Design Foundation contract
        run: |
          cat >/tmp/page-registry-contract.php <<'PHP'
          <?php
          define('ABSPATH', __DIR__ . '/');
          function sanitize_key($key) { return preg_replace('/[^a-z0-9_\-]/', '', strtolower((string)$key)); }
          function _doing_it_wrong($function, $message, $version) {}
          require getcwd() . '/src/Admin/Page.php';
          require getcwd() . '/src/Admin/PageRegistry.php';
          use CB\Core\Admin\Page;
          use CB\Core\Admin\PageRegistry;
          final class ContractPage implements Page {
              public function __construct(private string $id) {}
              public function slug(): string { return 'vendor-' . $this->id; }
              public function title(): string { return 'T'; }
              public function menu_title(): string { return 'T'; }
              public function capability(): string { return 'manage_options'; }
              public function position(): ?int { return 100; }
              public function render(): void {}
          }
          $components=['badges','cards','description-toggle','empty-state','form-controls','kv-table','nav-tabs','panels','state-badges','status'];
          foreach ($components as $i=>$component) {
              PageRegistry::_reset_for_testing();
              if (!PageRegistry::register(new ContractPage((string)$i), ['components'=>[$component]])) exit(1);
          }
          PageRegistry::_reset_for_testing();
          if (PageRegistry::register(new ContractPage('raw'), ['components'=>['cb-core-css-nav-tabs']])) exit(1);
          PHP
          php /tmp/page-registry-contract.php
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/Admin/PageRegistry.php').read_text()
          c=Path('src/Admin/AdminAssetCatalog.php').read_text()
          public=set(re.findall(r"'([a-z][a-z0-9-]+)'", re.search(r'COMPONENT_REQUIREMENTS = \[(.*?)\n\t\];',p,re.S).group(1)))
          mapped=set(re.findall(r"^\s*'([a-z][a-z0-9-]+)'\s*=>", re.search(r'enqueue_component_requirement.*?\$map = \[(.*?)\n\t\t\];',c,re.S).group(1),re.M))
          expected={'nav-tabs','panels','cards','badges','state-badges','status','empty-state','kv-table','form-controls','description-toggle'}
          assert public == mapped == expected, (public,mapped)
          assert 'table-cols' not in public and 'policy-table' not in public and 'log-table' not in public
          assert Path('docs/CORE-ADMIN-DESIGN-FOUNDATION.md').is_file()
          print('Design Foundation semantic contract PASS')
          PY

      - name: Validate rc3.27 scoping invariants
        run: |
          grep -q 'Version:     1.0.0-rc3.28' core-blueprint.php
          grep -q "define( 'CB_CORE_VERSION',     '1.0.0-rc3.28' );" core-blueprint.php
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('src/Admin/AdminAssetCatalog.php').read_text()
          block=re.search(r'public static function minimal_shell\(\): array \{(.*?)\n\t\}',s,re.S).group(1)
          items=re.findall(r"'([^']+)'",block)
          expected=['shell.tokens','shell.scrollbar','shell.layout','shell.buttons','shell.form-controls','shell.theme-canvas']
          assert items == expected, items
          print('Minimal shell invariant PASS')
          PY

      - name: Build canonical rc3.28 ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/release/core-blueprint"
          rsync -a --exclude='.git' --exclude='.github' ./ "$RUNNER_TEMP/release/core-blueprint/"
          cd "$RUNNER_TEMP/release"
          zip -qr "$GITHUB_WORKSPACE/core-blueprint-1.0.0-rc3.28.zip" core-blueprint
          test "$(unzip -Z1 "$GITHUB_WORKSPACE/core-blueprint-1.0.0-rc3.28.zip" | sed 's#/.*##' | sort -u)" = 'core-blueprint'
          unzip -p "$GITHUB_WORKSPACE/core-blueprint-1.0.0-rc3.28.zip" core-blueprint/core-blueprint.php | grep -q 'Version:     1.0.0-rc3.28'

      - name: Commit product patch and remove temporary workflow
        run: |
          git config user.name 'Core Blueprint CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/base-10e21-finalize.yml
          git add core-blueprint.php src/Admin/PageRegistry.php src/Admin/AdminAssetCatalog.php docs/PUBLIC-API.md docs/foundation-v1-contract.md docs/CORE-ADMIN-DESIGN-FOUNDATION.md CHANGELOG.md
          git commit -m 'BASE-10E.2.1 canonical Core Admin Design Foundation contract'
          git push origin HEAD:base-10e21-rc3.28

      - uses: actions/upload-artifact@v4
        with:
          name: core-blueprint-1.0.0-rc3.28
          path: core-blueprint-1.0.0-rc3.28.zip
          retention-days: 7
