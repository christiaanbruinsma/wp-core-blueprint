name: BASE-10E.1 release build

on:
  push:
    branches:
      - base-10e1-rc3.26

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rc3.26 branch
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build canonical plugin ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/release/core-blueprint"
          rsync -a --exclude='.git' --exclude='.github' ./ "$RUNNER_TEMP/release/core-blueprint/"
          cd "$RUNNER_TEMP/release"
          zip -qr "$GITHUB_WORKSPACE/core-blueprint-1.0.0-rc3.26.zip" core-blueprint
          unzip -Z1 "$GITHUB_WORKSPACE/core-blueprint-1.0.0-rc3.26.zip" | head -1 | grep -qx 'core-blueprint/'
          unzip -p "$GITHUB_WORKSPACE/core-blueprint-1.0.0-rc3.26.zip" core-blueprint/core-blueprint.php | grep -q 'Version:     1.0.0-rc3.26'

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: core-blueprint-1.0.0-rc3.26
          path: core-blueprint-1.0.0-rc3.26.zip
          if-no-files-found: error
          retention-days: 7
