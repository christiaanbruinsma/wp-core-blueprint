name: BASE-10E.2 source snapshot

on:
  push:
    branches:
      - base-10e2-rc3.27

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: base-10e2-rc3.27
      - name: Build source snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot/core-blueprint"
          rsync -a --exclude='.git' --exclude='.github' ./ "$RUNNER_TEMP/snapshot/core-blueprint/"
          cd "$RUNNER_TEMP/snapshot"
          zip -qr "$GITHUB_WORKSPACE/core-blueprint-e2-source.zip" core-blueprint
      - uses: actions/upload-artifact@v4
        with:
          name: core-blueprint-e2-source
          path: core-blueprint-e2-source.zip
          retention-days: 1
