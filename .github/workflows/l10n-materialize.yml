name: Localization materializer

on:
  push:
    branches:
      - mail-designer-md15-shared-designer-shell

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: mail-designer-md15-shared-designer-shell
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Materialize localized catalogs
        run: php tools/l10n-materialize.php

      - name: Validate translation guard and PHP syntax
        run: bash tests/bin/php-lint.sh

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit synchronized catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "L10N: synchronize Mail Designer catalogs"
          git push origin HEAD:mail-designer-md15-shared-designer-shell
