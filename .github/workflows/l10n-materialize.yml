name: Localization materializer

on:
  push:
    branches:
      - mail-designer-md15-shared-designer-shell

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: mail-designer-md15-shared-designer-shell
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Synchronize localized catalogs
        if: ${{ hashFiles('tools/l10n-mail-md15-sync.php') != '' }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('tools/l10n-mail-md15-sync.php')
          source = path.read_text()
          needle = "            foreach ($value as $source => $translation) {\n                if (!is_string($source) || !is_string($translation)) {"
          replacement = "            foreach ($value as $source => $translation) {\n                $source = is_int($source) ? (string) $source : $source;\n                if (!is_string($source) || !is_string($translation)) {"
          if needle not in source:
              raise SystemExit('Expected serializer guard was not found.')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          php -l tools/l10n-mail-md15-sync.php
          php tools/l10n-mail-md15-sync.php
          git checkout -- tools/l10n-mail-md15-sync.php

      - name: Validate translation guard and PHP syntax
        if: ${{ hashFiles('tools/l10n-mail-md15-sync.php') != '' }}
        run: bash tests/bin/php-lint.sh

      - name: Validate patch whitespace
        if: ${{ hashFiles('tools/l10n-mail-md15-sync.php') != '' }}
        run: git diff --check

      - name: Commit synchronized catalogs
        if: ${{ hashFiles('tools/l10n-mail-md15-sync.php') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/core-blueprint-*.l10n.php
          if git diff --cached --quiet; then
            echo "Localized catalogs are already synchronized."
            exit 0
          fi
          git commit -m "L10N: synchronize Mail Designer catalogs"
          git push origin HEAD:mail-designer-md15-shared-designer-shell
