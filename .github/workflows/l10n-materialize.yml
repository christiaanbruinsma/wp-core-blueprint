name: Localization materializer

on:
  push:
    branches:
      - mail-designer-md15-shared-designer-shell

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: mail-designer-md15-shared-designer-shell
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Synchronize localized catalogs
        if: ${{ hashFiles('tools/l10n-mail-md15-sync.php') != '' }}
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path('tools/l10n-mail-md15-sync.php')
          source = path.read_text(encoding='utf-8')

          stale_start_marker = "$stale = json_decode(<<<'JSON'\n["
          stale_end_marker = "\nJSON, true, 512, JSON_THROW_ON_ERROR);"
          stale_start = source.find(stale_start_marker)
          if stale_start < 0:
              raise SystemExit('Expected stale catalog block was not found.')
          stale_end = source.find(stale_end_marker, stale_start)
          if stale_end < 0:
              raise SystemExit('Expected stale catalog block terminator was not found.')
          stale_end += len(stale_end_marker)
          stale_values = [
              'A valid From Email is required before Mail can be enabled.',
              'Active mail transport: %s. You can safely prepare Core Blueprint Mail now, but its transport hooks stay inactive until the other mail plugin is disabled.',
              'Another mail transport is active: %s. Core Blueprint will not register transport hooks until the conflict is removed.',
              'Core Blueprint Mail is configured but inactive.',
              'Core Blueprint Mail is disabled. Enable it from the Dashboard before changing transport settings.',
              'Core Blueprint Mail transport is inactive because another mail transport is active.',
              'Enable Core Blueprint Mail before sending a test email.',
              'Mail disabled',
              'Mail settings saved.',
              'Mail settings saved. Core Blueprint transport stays inactive until the conflicting mail plugin is disabled.',
              'Review Mail settings',
          ]
          stale_replacement = "$stale = json_decode(<<<'JSON'\n" + json.dumps(stale_values, ensure_ascii=False, indent=2) + "\nJSON, true, 512, JSON_THROW_ON_ERROR);"
          source = source[:stale_start] + stale_replacement + source[stale_end:]

          key_needle = '                if (!is_string($source) || !is_string($translation)) {'
          key_replacement = '                $source = is_int($source) ? (string) $source : $source;\n' + key_needle
          if key_needle not in source:
              raise SystemExit('Expected serializer key guard was not found.')
          source = source.replace(key_needle, key_replacement, 1)

          value_needle = r'''                $out .= '        ' . php_string($source) . ' => ' . php_string($translation) . ",\n";'''
          value_replacement = r'''                $serializedSource = str_contains($source, "\4")
                    ? implode(' . "\\4" . ', array_map('php_string', explode("\4", $source)))
                    : php_string($source);
                $serializedTranslation = str_contains($translation, "\0")
                    ? implode(' . "\\0" . ', array_map('php_string', explode("\0", $translation)))
                    : php_string($translation);
                $out .= '        ' . $serializedSource . ' => ' . $serializedTranslation . ",\n";'''
          if value_needle not in source:
              raise SystemExit('Expected serializer value line was not found.')
          source = source.replace(value_needle, value_replacement, 1)

          php_string_marker = 'function php_string(string $value): string {'
          marker_at = source.rfind(php_string_marker)
          if marker_at < 0:
              raise SystemExit('Expected php_string helper was not found.')
          php_string_replacement = r'''function php_string(string $value): string {
              return "'" . str_replace(['\\', "'"], ['\\\\', "\\'"], $value) . "'";
          }
          '''
          source = source[:marker_at] + php_string_replacement

          path.write_text(source, encoding='utf-8')
          PY
          php -l tools/l10n-mail-md15-sync.php
          php tools/l10n-mail-md15-sync.php
          git checkout -- tools/l10n-mail-md15-sync.php

      - name: Validate translation guard and PHP syntax
        if: ${{ hashFiles('tools/l10n-mail-md15-sync.php') != '' }}
        run: bash tests/bin/php-lint.sh

      - name: Validate patch whitespace
        if: ${{ hashFiles('tools/l10n-mail-md15-sync.php') != '' }}
        run: git diff --check

      - name: Commit synchronized catalogs
        if: ${{ hashFiles('tools/l10n-mail-md15-sync.php') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/core-blueprint-*.l10n.php
          if git diff --cached --quiet; then
            echo "Localized catalogs are already synchronized."
            exit 0
          fi
          git commit -m "L10N: synchronize Mail Designer catalogs"
          git push origin HEAD:mail-designer-md15-shared-designer-shell
