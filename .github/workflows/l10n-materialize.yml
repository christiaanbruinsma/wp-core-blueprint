name: Localization materializer

on:
  push:
    branches:
      - mail-designer-md15-shared-designer-shell

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: mail-designer-md15-shared-designer-shell
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Diagnose localization payload
        run: |
          php <<'PHP'
          <?php
          $source = file_get_contents('tools/l10n-materialize.php');
          if ($source === false) {
              fwrite(STDERR, "Could not read materializer source.\n");
              exit(1);
          }

          $marker = '$payload = \'';
          $start = strpos($source, $marker);
          if ($start === false) {
              fwrite(STDERR, "Could not locate localization payload start.\n");
              exit(1);
          }
          $start += strlen($marker);
          $end = strpos($source, "';", $start);
          if ($end === false) {
              fwrite(STDERR, "Could not locate localization payload end.\n");
              exit(1);
          }

          $payload = substr($source, $start, $end - $start);
          $padding = (4 - (strlen($payload) % 4)) % 4;
          printf("Payload length: %d\n", strlen($payload));
          printf("Required Base64 padding: %d\n", $padding);

          $decoded = base64_decode($payload . str_repeat('=', $padding), true);
          if ($decoded === false) {
              fwrite(STDERR, "Strict Base64 decode still failed after padding.\n");
              exit(1);
          }

          printf("Strict Base64 decode: passed (%d bytes)\n", strlen($decoded));
          printf("Decoded prefix: %s\n", bin2hex(substr($decoded, 0, 8)));

          foreach (['gzdecode', 'gzinflate', 'gzuncompress'] as $decoder) {
              $json = @$decoder($decoded);
              if ($json === false) {
                  printf("%s: failed\n", $decoder);
                  continue;
              }

              printf("%s: passed (%d bytes)\n", $decoder, strlen($json));
              try {
                  $data = json_decode($json, true, 512, JSON_THROW_ON_ERROR);
                  printf("JSON decode: passed; top-level type=%s count=%d\n", gettype($data), is_countable($data) ? count($data) : 0);
              } catch (JsonException $exception) {
                  printf("JSON decode after %s: failed (%s)\n", $decoder, $exception->getMessage());
              }
          }
          PHP

      - name: Materialize localized catalogs
        run: php tools/l10n-materialize.php

      - name: Validate translation guard and PHP syntax
        run: bash tests/bin/php-lint.sh

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit synchronized catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "L10N: synchronize Mail Designer catalogs"
          git push origin HEAD:mail-designer-md15-shared-designer-shell
