name: Localization materializer

on:
  push:
    branches:
      - mail-designer-md15-shared-designer-shell

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          ref: mail-designer-md15-shared-designer-shell
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Diagnose localization payload
        run: |
          php <<'PHP'
          <?php
          $source = file_get_contents('tools/l10n-materialize.php');
          if ($source === false || !preg_match("/\\$payload = '([^']*)';/s", $source, $matches)) {
              fwrite(STDERR, "Could not locate localization payload.\n");
              exit(1);
          }

          $payload = $matches[1];
          printf("Payload length: %d\n", strlen($payload));
          printf("Payload length modulo 4: %d\n", strlen($payload) % 4);

          if (preg_match('/[^A-Za-z0-9+\\\/=]/', $payload, $invalid, PREG_OFFSET_CAPTURE)) {
              printf("First invalid byte: 0x%02X at offset %d\n", ord($invalid[0][0]), $invalid[0][1]);
          } else {
              echo "Base64 alphabet: valid\n";
          }

          $decoded = base64_decode($payload, true);
          if ($decoded === false) {
              echo "Strict Base64 decode: failed\n";
              exit(0);
          }

          echo "Strict Base64 decode: passed\n";
          printf("Decoded prefix: %s\n", bin2hex(substr($decoded, 0, 8)));
          PHP

      - name: Materialize localized catalogs
        run: php tools/l10n-materialize.php

      - name: Validate translation guard and PHP syntax
        run: bash tests/bin/php-lint.sh

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit synchronized catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "L10N: synchronize Mail Designer catalogs"
          git push origin HEAD:mail-designer-md15-shared-designer-shell
